<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>EXAMGUARD — Proctor Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6z"/><path d="M9.2 12.2l2 2 3.6-4"/></svg>
      </div>
      <div class="brand-name">EXAMGUARD</div>
    </div>

    <nav class="nav-group" id="navGroup">
      <button class="nav-item" data-nav="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h5v-5h2v5h5v-9"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-nav="my-exams">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
        My Exams
      </button>
      <button class="nav-item" data-nav="ai-alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 21 19H3z"/><path d="M12 10v4"/><path d="M12 16.2v.3"/></svg>
        AI Alerts
        <span class="badge-count" id="sidebarAlertCount">7</span>
      </button>
      <button class="nav-item" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6"/></svg>
        Settings
      </button>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-user">
      <div class="avatar">HM</div>
      <div class="who">
        <div class="name">Hassan Mostafa</div>
        <div class="role">Proctor</div>
      </div>
      <button class="icon-btn" title="Log out" data-logout>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h4"/><path d="M14 8l4 4-4 4"/><path d="M18 12H8"/></svg>
      </button>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <button class="hamburger" id="hamburgerBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-sub" id="topbarSub">Overview of your assigned exams</div>
      </div>
      <div class="topbar-right">
        <div class="bell-wrap">
          <button class="icon-btn" title="Notifications" style="color:var(--text-muted);">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0v5l2 3H4l2-3z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          </button>
          <span class="bell-dot"></span>
        </div>
        <div class="who-mini">
          <div class="avatar" style="width:30px;height:30px;font-size:11px;">HM</div>
          <div>
            <div class="name">Hassan Mostafa</div>
            <div class="role">Proctor</div>
          </div>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
      </div>
    </header>

    <main class="content" id="contentScroll">
      <div class="content-inner" id="content"></div>
    </main>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
